name: Sprawdź projekt ARTYKUŁY
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Sprawdź składnię
        run: python -m py_compile app.py desktop_app.py
