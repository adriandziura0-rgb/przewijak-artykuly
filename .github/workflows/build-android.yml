name: Build APK ARTYKULY PHONE

on:
  workflow_dispatch:
  push:
    paths:
      - 'app.py'
      - 'android/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Zainstaluj Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Sprawdź wspólny CORE
        run: python -m py_compile app.py android/app/src/main/python/mobile_entry.py

      - name: Zbuduj APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Przygotuj nazwę APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Przewijak_ARTYKULY_PHONE_V15_3.apk
          ls -lh Przewijak_ARTYKULY_PHONE_V15_3.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Przewijak_ARTYKULY_PHONE_V15_3
          path: Przewijak_ARTYKULY_PHONE_V15_3.apk
          if-no-files-found: error
